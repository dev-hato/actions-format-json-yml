---
version: 2
registries:
  npm-flatt:
    type: npm-registry
    url: https://npm.flatt.tech/
    replaces-base: true
updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - npm-flatt
    schedule:
      interval: weekly
    # Cooldown applies only to version updates, not security updates.
    cooldown:
      default-days: 7
    # Renovate handles version updates; Dependabot handles security updates.
    open-pull-requests-limit: 0
