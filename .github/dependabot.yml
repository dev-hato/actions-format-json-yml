---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Use https://npm.flatt.tech/ from the project's .npmrc without authentication.
    schedule:
      interval: weekly
    # Cooldown applies only to version updates, not security updates.
    cooldown:
      default-days: 7
    # Renovate handles version updates; Dependabot handles security updates.
    open-pull-requests-limit: 0
